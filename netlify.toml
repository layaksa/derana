[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vite serves a client-side SPA. Keep API paths available for a future
# Netlify Function or external API instead of rewriting them to index.html.
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
  force = false

# Preserve client-side navigation on refresh and direct deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[headers]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
